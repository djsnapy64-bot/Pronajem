name: Ostrava Byty Checker

on:
  schedule:
    # Spouští se každý den v 7:00 UTC (8:00 SEČ / 9:00 SELČ)
    - cron: '0 7 * * *'
  workflow_dispatch: # Umožňuje ruční spuštění tlačítkem v GitHub Actions

permissions:
  contents: write # Vyžadováno pro uložení seen_items.db zpět do repozitáře

jobs:
  check-apartments:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalace závislostí
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Spuštění hlídače bytů
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
          NTFY_SERVER_URL: ${{ vars.NTFY_SERVER_URL || 'https://ntfy.sh' }}
          NTFY_ACCESS_TOKEN: ${{ secrets.NTFY_ACCESS_TOKEN || '' }}
          FILTER_ALLOWED_DISPOSITIONS: ${{ vars.FILTER_ALLOWED_DISPOSITIONS || '2+1,2+kk,3+1,3+kk,4+1,4+kk' }}
          FILTER_MAX_RENT: ${{ vars.FILTER_MAX_RENT || '15000' }}
          FILTER_MIN_AREA_M2: ${{ vars.FILTER_MIN_AREA_M2 || '40' }}
          SCRAPE_DISTRICTS: ${{ vars.SCRAPE_DISTRICTS || 'moap,poruba' }}
          DB_PATH: 'seen_items.db'
        run: |
          python main.py

      - name: Uložení stavové databáze (deduplikace)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: aktualizace databáze viděných nabídek [skip ci]"
          file_pattern: "seen_items.db"
